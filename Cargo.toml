[package]
name = "cyfile"
version = "0.6.1"
edition = "2024"
license = "MIT"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
zip = "8.6.0"

[dev-dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
cyfile-old = { package = "cyfile", git = "https://github.com/Goolnn/cyfile.git", tag = "v0.5.1" }
image = "0.25.10"
indicatif = "0.18.6"
rayon = "1.12.0"
